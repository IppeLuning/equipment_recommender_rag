[project]
name = "equipment_recommender_rag"
version = "0.1.0"
description = "Equipment recommendation using RAG or dense retrieval"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=49.0.0",
    "flagembedding>=1.4.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "openai>=2.41.0",
    "pandas>=3.0.1",
    "pypdf[crypto]>=6.13.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "torch>=2.12.0",
    "transformers>=5.10.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, formatting, imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
